description: department member upsert returns the updated member
name: admin_department_member_upsert
request:
  method: PUT
  url: /api/admin/departments/3/members/7
  headers:
    Content-Type: application/json
  body:
    roleCodes: [PROJECT_LEADER]
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    success: true
    data:
      userId: 7
      username: bob
      realName: Bob
      deptId: 3
      deptName: Science
      phone: "13800000000"
      email: null
      enabled: true
      roleCodes: [PROJECT_LEADER]
      editableRoleCodes: [PROJECT_LEADER, EXPERT, FINANCE_ADMIN]
    message: OK
