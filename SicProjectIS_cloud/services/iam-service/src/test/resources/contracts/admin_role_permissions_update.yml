description: role permission update preserves diff and refreshed matrix
name: admin_role_permissions_update
request:
  method: PUT
  url: /api/admin/roles/PROJECT_LEADER/permissions
  headers:
    Content-Type: application/json
  body:
    permissionCodes: ["project:create"]
response:
  status: 200
  headers:
    Content-Type: application/json
  body:
    success: true
    data:
      roleCode: PROJECT_LEADER
      diff:
        added: [PROJECT_LEADER]
        removed: []
      matrix:
        roles:
          - roleId: 2
            roleCode: PROJECT_LEADER
            roleName: Project leader
            roleDesc: null
            enabled: true
        permissions:
          - permissionId: 5
            permissionCode: "project:create"
            permissionName: Create project
            permissionGroup: API
            permissionDesc: null
        matrix:
          - roleCode: PROJECT_LEADER
            roleName: Project leader
            enabled: true
            permissionCodes: ["project:create"]
    message: OK
