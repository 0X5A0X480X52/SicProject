description: member removal returns project authorization detail
name: project_member_remove
request:
  method: DELETE
  url: /api/projects/10/members/7
response:
  status: 200
  headers: { Content-Type: application/json }
  body:
    success: true
    data:
      project: { projectId: 10 }
      capabilities: { canManageLeader: true, canManageMembers: true, canManageExperts: true, canManageFinance: false, canManageProxy: true }
    message: OK
