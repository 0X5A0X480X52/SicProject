description: expert assignment DELETE returns refreshed detail
name: expert_review_assignment_delete
request:
  method: DELETE
  url: /api/expert-reviews/assignments/40
response:
  status: 200
  headers: { Content-Type: application/json }
  body:
    success: true
    data:
      batch: { batchId: 30 }
      assignments:
        - assignment: { assignmentId: 40, expertUserId: 7, reviewStatus: ASSIGNED }
          scores: []
    message: OK
