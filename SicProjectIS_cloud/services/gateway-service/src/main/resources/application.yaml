spring:
  application:
    name: gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://config-server:8888}

sic:
  security:
    issuer: ${JWT_ISSUER:sic-iam}
    audience: ${JWT_AUDIENCE:sic-api}
    jwk-set-uri: ${JWK_SET_URI:http://iam-service:9001/.well-known/jwks.json}
