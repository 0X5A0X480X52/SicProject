server:
  port: 9004
spring:
  datasource:
    url: ${MATERIAL_DB_URL:jdbc:mysql://mysql:3306/sic_material?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MATERIAL_DB_USERNAME:sic_material}
    password: ${MATERIAL_DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/common
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:50MB}
      max-request-size: ${MAX_REQUEST_SIZE:55MB}

sic:
  minio:
    endpoint: ${MINIO_ENDPOINT:http://minio:9000}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:sic-materials}
  service-client:
    bootstrap-secret: ${SERVICE_TOKEN_BOOTSTRAP_SECRET}
