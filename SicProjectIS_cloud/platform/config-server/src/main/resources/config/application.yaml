eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/,http://discovery-peer:8761/eureka/}
    timeout:
      connect-timeout: 2000
      connect-request-timeout: 2000
      socket-timeout: 5000
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sic}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 500ms
          multiplier: 2
          max-interval: 8s
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      connect-timeout: 1s
      timeout: 2s
  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      connection-timeout: 3000
      validation-timeout: 1000
  cloud:
    loadbalancer:
      retry:
        enabled: false
    circuitbreaker:
      resilience4j:
        disable-time-limiter: true
      bulkhead:
        resilience4j:
          enabled: false
    openfeign:
      # 所有 Feign 调用接入断路器；客户端未声明 fallback，失败仍向业务层显式返回异常。
      circuitbreaker:
        enabled: true
      client:
        config:
          default:
            # 内部同步请求采用有界连接/读取等待，避免下游故障长期占用业务线程和数据库连接。
            connectTimeout: 1000
            readTimeout: 3000

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 20
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        ignoreExceptions:
          - feign.FeignException$BadRequest
          - feign.FeignException$Unauthorized
          - feign.FeignException$Forbidden
          - feign.FeignException$NotFound
          - feign.FeignException$Conflict

sic:
  observability:
    load-balancer-evidence-enabled: ${SIC_LB_EVIDENCE_ENABLED:false}
  security:
    issuer: ${JWT_ISSUER:sic-iam}
    audience: ${JWT_AUDIENCE:sic-api}
    jwk-set-uri: ${JWK_SET_URI:http://iam-service:9001/.well-known/jwks.json}
  messaging:
    exchange: sic.events
    batch-size: 100
    fixed-delay-ms: 1000
    publisher-enabled: true

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} saga=%X{sagaId:-} event=%X{eventId:-} user=%X{userId:-}]"
