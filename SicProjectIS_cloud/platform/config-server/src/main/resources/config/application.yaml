eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://discovery-server:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

spring:
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:sic}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 500ms
          multiplier: 2
          max-interval: 8s
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

sic:
  security:
    issuer: ${JWT_ISSUER:sic-iam}
    audience: ${JWT_AUDIENCE:sic-api}
    jwk-set-uri: ${JWK_SET_URI:http://iam-service:9001/.well-known/jwks.json}
  messaging:
    exchange: sic.events
    batch-size: 100
    fixed-delay-ms: 1000
    publisher-enabled: true

logging:
  pattern:
    level: "%5p [trace=%X{traceId:-} saga=%X{sagaId:-} event=%X{eventId:-} user=%X{userId:-}]"
